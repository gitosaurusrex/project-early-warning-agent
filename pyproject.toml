[project]
name = "pewa"
version = "0.1.0"
description = "Project Early-Warning Agent: flags at-risk epics from Jira, GitHub and Slack activity"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "typer>=0.12",
]

[project.scripts]
pewa = "pewa.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pewa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "llm: runs the real model (opt-in, needs ANTHROPIC_API_KEY)",
]
addopts = "-m 'not llm'"
