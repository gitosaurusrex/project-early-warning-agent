<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root { --bg: #f3f5f8; --surface: #ffffff; --surface-2: #eef1f6; --text: #141821; --muted: #5a6475; --border: #dde2ea; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg: #0d1016; --surface: #151a22; --surface-2: #1b212b; --text: #e8ebf1; --muted: #9aa4b5; --border: #262d39; color-scheme: dark; } }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 "Segoe UI", system-ui, -apple-system, sans-serif; }
main { max-width: 1120px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 22px; margin: 0 0 4px; } h2 { font-size: 17px; margin: 28px 0 10px; }
details { margin-top: 16px; } summary { cursor: pointer; color: var(--muted); }
{% include "_bt_style.css" %}
</style>
