<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root { --bg: #f7f7f5; --surface: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --border: #e2e1dc; color-scheme: light dark; }
@media (prefers-color-scheme: dark) { :root { --bg: #141413; --surface: #1d1d1b; --text: #ecebe6; --muted: #a09f98; --border: #33332f; } }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 1120px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 22px; margin: 0 0 4px; } h2 { font-size: 17px; margin: 28px 0 10px; }
details { margin-top: 16px; } summary { cursor: pointer; color: var(--muted); }
{% include "_bt_style.css" %}
</style>
