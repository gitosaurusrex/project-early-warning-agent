<div class="card" style="margin-top:16px">
  <p style="display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; margin:0 0 8px">
    <strong>{{ "Exec summary" if r.variant == "exec" else "Engineering detail" }}</strong>
    <span class="small muted">{{ r.words }} words · {{ "written by the model" if r.source == "model" else "template" }}
      <button class="ghost" type="button" onclick="navigator.clipboard.writeText(this.closest('.card').querySelector('textarea').value); this.textContent='Copied'">Copy Markdown</button></span>
  </p>
  {% if r.error %}<div class="notice small">The model's draft couldn't be used ({{ r.error }}), so this is the template version.</div>{% endif %}
  <textarea class="md" readonly>{{ r.markdown }}</textarea>
</div>
