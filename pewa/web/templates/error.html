{% extends "base.html" %}
{% block title %}Error{% endblock %}
{% block content %}
<section class="card stack">
  <p class="eyebrow" style="color: var(--red)">Something went wrong</p>
  <h1>{{ message }}</h1>
  {% if hint %}<p class="muted">{{ hint }}</p>{% endif %}
  <p><a class="btn ghost" href="/">Back to the overview</a></p>
</section>
{% endblock %}
